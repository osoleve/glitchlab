[project]
name = "glitchloom"
version = "0.9.0"
description = "A local-first typed inference loom for base-model experiments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["language-models", "local-first", "research", "synthetic-data", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=4,<5",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.25,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
glitchloom = "glitchloom.server:main"

[project.urls]
Homepage = "https://github.com/osoleve/glitchlab"
Repository = "https://github.com/osoleve/glitchlab.git"
Issues = "https://github.com/osoleve/glitchlab/issues"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glitchloom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
